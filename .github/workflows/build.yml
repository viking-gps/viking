# CI runs on Github are of course not an unlimited (free) resource
# Thus as such, the multiple build time variances (OSs / build configurations / etc...) can not be all be performed
# Also see the build-variants.yml that checks some build configurations.
# Furthermore, one can also try the local 'buildtests.sh' on your host OS that checks some build configurations.
#
# For the CI, only the 'latest' OS and full options are the primary concern.
# Any older/other OSs and build combinations are provided as a courtesy;
#  if you run them, you are empowered to resolve such issues.
name: CI Primary Build and Tests

on:
  push:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

# See at least https://github.com/actions/runner-images/issues/2155
#  regarding ubuntu default image vs server packages mismatch
# Hence must always *update* before applying any install
# xvfb is only needed for headless CI tests
    - name: "Install requirements"
      run: sudo apt-get update -y && sudo apt-get install gtk-doc-tools docbook-xsl yelp-tools libpng-dev libgtk-3-dev libicu-dev libjson-glib-dev intltool autopoint xxd libcurl4-gnutls-dev libglib2.0-dev-bin libsqlite3-dev libmapnik-dev libgeoclue-2-dev libgps-dev libmagic-dev libbz2-dev libzip-dev liboauth-dev libnova-dev xvfb
      # libgexiv2-dev removed
      shell: bash

# Fake DISPLAY for detection as used in configure - which decides which tests to run for the main check
    - name: Configure
      run: xvfb-run ./autogen.sh --disable-geotag
      # libgexiv2-dev in current versions of Ubuntu are too old and we are not going to support multiple incompatible versions.

    - name: Build
      run: make

# Full tests - including those that use a DISPLAY
    - name: Run check
      run: xvfb-run make check

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-suite-log-${{ matrix.os }}
        path: test/test-suite.log
        retention-days: 7

# NB During this build/run inside the distcheck there is no DISPLAY
# Hence number of tests run is less (since some rely on GTK3 and a DISPLAY - thus are omitted)
#  than the main check performed above
    - name: Run distcheck
      run: make distcheck DISTCHECK_CONFIGURE_FLAGS=--disable-geotag
      # libgexiv2-dev in current versions of Ubuntu are too old and we are not going to support multiple incompatible versions.

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-suite-log-${{ matrix.os }}
        path: viking-1.*/_build/sub/test/test-suite.log
        retention-days: 7
